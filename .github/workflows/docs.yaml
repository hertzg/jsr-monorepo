name: docs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  docs:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache dependencies
        run: deno install

      - name: Generate docs
        run: deno run --allow-read --allow-write --allow-run _tools/gen_docs.ts docs

      - name: Deploy main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          clean: true
          clean-exclude: pr/

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          target-folder: pr/${{ github.event.pull_request.number }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: docs-preview
          message: |
            **Docs preview:** https://hertzg.github.io/jsr-monorepo/pr/${{ github.event.pull_request.number }}/

  remove-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Create empty folder
        run: mkdir -p .preview-empty

      - name: Remove PR preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .preview-empty
          target-folder: pr/${{ github.event.pull_request.number }}
