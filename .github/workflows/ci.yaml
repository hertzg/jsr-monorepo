name: ci

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bun:
          - latest
        os:
          - ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # The npm verification installs with npm and imports under node.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: sudo apt-get install -y wireguard-tools
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Publish dry run (JSR)
        run: |
          bun _tools/build_jsr.ts
          bun x jsr publish --dry-run

      - name: Publish dry run (npm)
        run: |
          bun _tools/build_npm.ts
          bun _tools/verify_npm.ts

      - name: Run tests
        run: |
          bun run test

      - name: Generate lcov report
        run: |
          bun run cov:gen

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          name: ${{ matrix.os }}-bun-${{ matrix.bun }}
          files: cov/lcov.info

  lint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
