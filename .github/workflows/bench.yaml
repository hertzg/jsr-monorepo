name: bench

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run benchmarks on PR branch
        run: |
          bun install --frozen-lockfile
          bun run --silent bench:json > bench-pr.json || true

      - name: Checkout base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}

      - name: Run benchmarks on base branch
        # A base from before the Bun migration has no lockfile or bench script.
        # The report then shows every benchmark as new.
        run: |
          bun install --frozen-lockfile && bun run --silent bench:json > bench-base.json || true

      - name: Checkout PR branch
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}

      - name: Compare benchmarks and generate report
        id: bench-diff
        run: |
          bun install --frozen-lockfile
          bun _tools/bench_diff.ts bench-base.json bench-pr.json > bench-report.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## Benchmark Results"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: bench-report.md
          edit-mode: replace
